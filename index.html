<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWC Tithe</title>
    <meta name="description" content="AWC Tithe — church giving with Stripe and Plaid, settled to DCU Credit Union, synced to the AWC Digital Contribution Book." />
    <meta property="og:title" content="AWC Tithe" />
    <meta property="og:description" content="Give to Anointed Worship Center. Settled to DCU. Synced to AWC DCB." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/awc-crest.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/awc-crest.png" />
    <link rel="icon" type="image/png" href="/images/awc-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #awc-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(122, 20, 20, 0.35), transparent 55%),
          linear-gradient(160deg, #2A0202 0%, #4A0404 55%, #1a0101 100%);
        color: #fff;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #awc-boot.awc-boot--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #awc-boot img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 9999px;
        background: #fff;
        object-fit: contain;
        border: 1px solid rgba(212, 175, 55, 0.45);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
      #awc-boot .awc-boot-brand {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #awc-boot .awc-boot-sub {
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(212, 175, 55, 0.9);
        font-weight: 600;
      }
      #awc-boot .awc-boot-pulse {
        width: 2.25rem;
        height: 2px;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #D4AF37, transparent);
        animation: awc-boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes awc-boot-pulse {
        0%, 100% { opacity: 0.35; transform: scaleX(0.7); }
        50% { opacity: 1; transform: scaleX(1); }
      }
    </style>
  </head>
  <body class="bg-[#F7F4EF] text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div id="awc-boot" aria-live="polite" aria-busy="true">
      <img src="/images/awc-logo.png" alt="" width="72" height="72" />
      <div class="awc-boot-brand">AWC Tithe</div>
      <div class="awc-boot-sub">Anointed Worship Center</div>
      <div class="awc-boot-pulse" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var hide = function () {
          var el = document.getElementById('awc-boot');
          if (!el || el.classList.contains('awc-boot--hide')) return;
          el.classList.add('awc-boot--hide');
          el.setAttribute('aria-busy', 'false');
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 400);
        };
        window.addEventListener('load', function () {
          setTimeout(hide, 180);
        });
        // Fallback if module load is slow after HTML arrives
        setTimeout(hide, 8000);
      })();
    </script>
  </body>
</html>
