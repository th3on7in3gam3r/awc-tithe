# Pings AWC Tithe /api/health every 12 minutes to reduce Render free-tier sleep.
# Set repository secret RENDER_HEALTH_URL to:
#   https://awc-tithe.onrender.com/api/health
name: Keep-alive Render health ping

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL secret not set — skip (configure in repo Settings → Secrets)."
            exit 0
          fi
          curl -fsS --max-time 60 "$RENDER_HEALTH_URL" | head -c 500
          echo
