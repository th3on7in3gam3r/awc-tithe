services:
  - type: web
    name: awc-tithe
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RECEIPT_FROM_EMAIL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: AWC_DCB_API_URL
        sync: false
      - key: AWC_DCB_KEY_TITHE
        sync: false
      - key: AWC_VAULT_KEY
        sync: false
      - key: DCB_REQUIRED
        sync: false
      - key: ZELLE_RECIPIENT
        sync: false
      - key: ZELLE_RECIPIENT_NAME
        sync: false
      - key: VENMO_HANDLE
        value: anointedworshipcenter
      - key: CASHAPP_RECIPIENT
        sync: false
      - key: CASHAPP_RECIPIENT_NAME
        sync: false
      - key: FINANCE_ALERT_EMAILS
        sync: false
      - key: STRIPE_CASHAPP_PAY_ENABLED
        value: "false"
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
